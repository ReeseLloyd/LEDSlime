<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDSlime v1.3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #05060f;
  color: #445;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 16px;
  user-select: none;
}
h1 { font-size: 11px; letter-spacing: 4px; color: #222533; text-transform: uppercase; }
canvas { display: block; }
.controls { display: flex; gap: 10px; align-items: center; }
select, button {
  background: #0c0d1a;
  color: #445;
  border: 1px solid #191b2e;
  padding: 5px 14px;
  font-family: monospace;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  outline: none;
}
select:hover, button:hover {
  background: #131525;
  color: #6677aa;
  border-color: #252840;
}
button.active {
  color: #6677aa;
  border-color: #252840;
}
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 3px;
  background: #191b2e;
  outline: none;
  cursor: pointer;
  border-radius: 2px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  background: #445;
  border-radius: 50%;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb:hover { background: #6677aa; }
input[type=range]::-moz-range-thumb {
  width: 10px; height: 10px;
  background: #445; border: none; border-radius: 50%; cursor: pointer;
}
.speed-label { font-size: 11px; min-width: 38px; }
</style>
</head>
<body>
<h1>LED Slime</h1>
<canvas id="c"></canvas>
<div class="controls">
  <select id="preset">
    <option value="network">Network</option>
    <option value="radiant">Radiant</option>
    <option value="vortex">Vortex</option>
    <option value="swarms">Swarms</option>
    <option value="tendrils">Tendrils</option>
    <!-- <option value="blobs">Blobs</option> — suspended, revisit later -->
    <!-- <option value="rings">Rings</option> — suspended, revisit later -->
  </select>
  <input type="range" id="speed" min="5" max="200" step="5" value="50">
  <span class="speed-label" id="speedLabel">50%</span>
  <button id="btn">↺ Restart</button>
  <button id="nucleiBtn" class="active">nuclei</button>
</div>

<script>
// ── PRNG ─────────────────────────────────────────────────────────────────────

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── HSL → RGB ─────────────────────────────────────────────────────────────────

function hslToRgb(h, s, l) {
  // h: 0–360, s: 0–1, l: 0–1  →  [r, g, b] each 0–255
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if      (h < 60)  { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

// ── Constants ─────────────────────────────────────────────────────────────────

const DEG = Math.PI / 180;
const W = 100, H = 100, CELL = 6;
const PW = W * CELL, PH = H * CELL;

// ── Presets ───────────────────────────────────────────────────────────────────
//
// sa        sensor angle (rad)        — spread between left/right sensor and forward
// ra        rotation angle (rad)      — how sharply agents steer each step
// sd        sensor distance (cells)   — how far ahead sensors reach
// step      movement per tick (cells)
// decay     trail multiplier per tick (< 1 → fades over time)
// spread    diffusion rate            — how much trail bleeds to neighbours
// deposit   trail added per agent visit
// spf       base simulation ticks per frame (scaled by speedMult)
// wander    probability [0–1] of ignoring trail sensing and picking a random heading
// placement initial agent distribution

const PRESETS = {
  network: {
    // More agents + longer sensor reach → denser, more globally-connected webs.
    // Low deposit keeps a visible brightness gradient (no flat-bright highways).
    n: 4000, sa: 30*DEG, ra: 45*DEG, sd: 9,  step: 1.0,
    decay: 0.93, spread: 0.14, deposit: 0.08, spf: 3,
    wander: 0.012,
    placement: 'random',
    nucleus: { minInterval: 300, maxInterval: 700, agentsPerNucleus: 160, radius: 5 },
  },
  radiant: {
    // Multiple radiant sources instead of one centre — each blazes outward then
    // the spokes from adjacent sources reach toward each other and merge.
    n: 3000, sa: 22*DEG, ra: 40*DEG, sd: 9,  step: 1.1,
    decay: 0.91, spread: 0.10, deposit: 0.09, spf: 3,
    wander: 0.008,
    placement: 'multi-center',
    nucleus: { minInterval: 300, maxInterval: 600, agentsPerNucleus: 120, radius: 4 },
  },
  /* blobs — suspended: converges too quickly into a static pool, revisit later
  blobs: {
    n: 3500, sa: 55*DEG, ra: 80*DEG, sd: 5,  step: 0.9,
    decay: 0.84, spread: 0.14, deposit: 0.08, spf: 2,
    wander: 0.015,
    placement: 'clusters',
    burst:   { wander: 0.25, duration: 150, threshold: 3.0, emaAlpha: 0.04, cooldown: 400 },
    nucleus: { minInterval: 300, maxInterval: 700, agentsPerNucleus: 160, radius: 5 },
  }, */
  /* rings — suspended: agents collapse into lines/blobs; ring-forming geometry
     is hard to stabilise at grid scale; revisit later
  rings: {
    n: 1800, sa: 80*DEG, ra: 40*DEG, sd: 5,  step: 1.0,
    decay: 0.90, spread: 0.04, deposit: 0.08, spf: 2,
    wander: 0.004,
    placement: 'rings',
    nucleus: { minInterval: 350, maxInterval: 700, agentsPerNucleus: 90, radius: 5 },
  }, */
  vortex: {
    // Sensor angle at 53° sits in the "swirl zone" between Network's straight
    // paths (30°) and ring-forming territory (>70°) — agents arc rather than
    // go straight, producing rotating masses and visible migration streams.
    // clusters placement seeds 7–11 distinct swirling masses that grow, drift,
    // and interact.  Gentle ra (30°) produces large-radius curves not tight
    // spirals.  Fast step (1.3) makes individual agent motion visible.
    // 3% wander continuously redirects groups, seeding new migrations and
    // preventing any mass from locking into a static orbit.
    n: 2800, sa: 53*DEG, ra: 30*DEG, sd: 8,  step: 1.3,
    decay: 0.87, spread: 0.11, deposit: 0.09, spf: 3,
    wander: 0.060,
    placement: 'clusters',
    nucleus: { minInterval: 260, maxInterval: 560, agentsPerNucleus: 140, radius: 7 },
  },
  swarms: {
    // Very fast decay (0.75, half-life ~2.4 ticks) means trail evaporates almost
    // immediately — agents chase each other's brief glowing wakes rather than
    // following long-lived paths.  High wander (8%) and fast step keep groups
    // churning.  High spread creates a soft diffuse sensing field so loose
    // clusters stay loosely cohesive without locking into rigid structures.
    n: 3500, sa: 35*DEG, ra: 30*DEG, sd: 7,  step: 1.4,
    decay: 0.75, spread: 0.22, deposit: 0.15, spf: 4,
    wander: 0.08,
    placement: 'random',
    nucleus: { minInterval: 400, maxInterval: 800, agentsPerNucleus: 140, radius: 6 },
  },
  tendrils: {
    // Faster decay means established paths fade and must be actively re-forged.
    // 6% wander fires agents on random headings, continuously seeding new tendrils.
    // Together these keep the system searching rather than settling.
    n: 1800, sa: 45*DEG, ra: 20*DEG, sd: 12, step: 1.3,
    decay: 0.84, spread: 0.08, deposit: 0.07, spf: 3,
    wander: 0.06,
    placement: 'edges',
    nucleus: { minInterval: 400, maxInterval: 800, agentsPerNucleus: 80, radius: 4 },
  },
};

// ── Simulation state ──────────────────────────────────────────────────────────

let agents   = [];
let trail    = new Float32Array(W * H);
let trailB   = new Float32Array(W * H);
let cfg      = PRESETS.network;
let curColor = [80, 220, 255];  // updated in init() from seed

// Burst state (used by presets with a burst config)
let burstActive    = false;
let burstRemaining = 0;
let burstCooldown  = 0;
let trailDeltaEMA  = 100.0;  // initialised high so burst doesn't fire at start
let prevTrailSum   = 0;

// Nucleus injection state
let nucleusEnabled = true;   // toggled by UI button
let nucleusTick    = 0;      // countdown ticks until next injection

// ── Init ──────────────────────────────────────────────────────────────────────

function init(key, seed) {
  cfg = PRESETS[key];
  const rng = mulberry32(seed);

  // Derive a vivid random hue from the seed (full saturation, mid lightness)
  curColor = hslToRgb(rng() * 360, 1.0, 0.55);

  trail.fill(0);
  trailB.fill(0);
  agents = [];
  burstActive = false; burstRemaining = 0; burstCooldown = 0;
  trailDeltaEMA = 100.0; prevTrailSum = 0;
  if (cfg.nucleus) {
    const nc = cfg.nucleus;
    nucleusTick = nc.minInterval + Math.floor(Math.random() * (nc.maxInterval - nc.minInterval));
  }

  // Pre-generate centres for cluster-based placements
  let centers = null;
  if (cfg.placement === 'clusters' || cfg.placement === 'multi-center' || cfg.placement === 'rings') {
    centers = [];
    const nc = cfg.placement === 'clusters'
      ? 7 + Math.floor(rng() * 5)    // 7–11 blob clusters
      : cfg.placement === 'rings'
      ? 4 + Math.floor(rng() * 3)    // 4–6 ring centres
      : 2 + Math.floor(rng() * 3);   // 2–4 radiant sources
    for (let j = 0; j < nc; j++) {
      centers.push({
        x: 10 + rng() * (W - 20),
        y: 10 + rng() * (H - 20),
      });
    }
  }

  for (let i = 0; i < cfg.n; i++) {
    let x, y, a;
    switch (cfg.placement) {
      case 'center': {
        // Tight cluster at centre, agents pointing outward
        const r  = rng() * 12;
        const th = rng() * Math.PI * 2;
        x = W * 0.5 + Math.cos(th) * r;
        y = H * 0.5 + Math.sin(th) * r;
        a = th;
        break;
      }
      case 'multi-center': {
        // Agents cluster near each source and point outward — spokes radiate
        // then the fronts from adjacent sources find each other and connect.
        const c  = centers[i % centers.length];
        const r  = rng() * 8;
        const th = rng() * Math.PI * 2;
        x = c.x + Math.cos(th) * r;
        y = c.y + Math.sin(th) * r;
        a = th;   // outward from source
        break;
      }
      case 'clusters': {
        // Distribute evenly across random cluster centres
        const c  = centers[i % centers.length];
        const r  = rng() * 7;
        const th = rng() * Math.PI * 2;
        x = c.x + Math.cos(th) * r;
        y = c.y + Math.sin(th) * r;
        a = rng() * Math.PI * 2;
        break;
      }
      case 'rings': {
        // Place agents on circular arcs at varied radii around each centre,
        // pointing tangentially.  The extreme sa drives them straight into
        // stable orbits along these starting tracks.
        const c  = centers[i % centers.length];
        const r  = 3 + rng() * 4;            // radii 3–7 cells — matches natural orbit scale
        const th = rng() * Math.PI * 2;
        x = c.x + Math.cos(th) * r;
        y = c.y + Math.sin(th) * r;
        a = th + Math.PI * 0.5;              // tangential = perpendicular to radial
        break;
      }
      case 'edges': {
        // Scattered along all four edges, pointing inward
        const side = Math.floor(rng() * 4);
        if      (side === 0) { x = rng()*W; y = 1;   a =  Math.PI*0.5 + (rng()-0.5)*0.4; }
        else if (side === 1) { x = rng()*W; y = H-2; a = -Math.PI*0.5 + (rng()-0.5)*0.4; }
        else if (side === 2) { x = 1;       y = rng()*H; a =              (rng()-0.5)*0.4; }
        else                 { x = W-2;     y = rng()*H; a = Math.PI    + (rng()-0.5)*0.4; }
        break;
      }
      default: {
        x = rng() * W;
        y = rng() * H;
        a = rng() * Math.PI * 2;
      }
    }
    agents.push({ x, y, a });
  }
}

// ── Nucleus injection helpers ─────────────────────────────────────────────────

function pickEmptyRegion() {
  // Sample 8 random candidate positions, return the one with the lowest local
  // trail density — so new nuclei seed into unexplored space rather than on top
  // of existing structure.
  let bestX = W / 2, bestY = H / 2, bestSum = Infinity;
  for (let t = 0; t < 8; t++) {
    const tx = 10 + Math.random() * (W - 20);
    const ty = 10 + Math.random() * (H - 20);
    let s = 0;
    for (let dy = -5; dy <= 5; dy++) {
      for (let dx = -5; dx <= 5; dx++) {
        const ix = ((Math.round(tx) + dx + W) % W);
        const iy = ((Math.round(ty) + dy + H) % H);
        s += trail[iy * W + ix];
      }
    }
    if (s < bestSum) { bestSum = s; bestX = tx; bestY = ty; }
  }
  return { x: bestX, y: bestY };
}

function injectNucleus() {
  const nc  = cfg.nucleus;
  // 1 nucleus most of the time, occasionally 2
  const num = 1 + (Math.random() < 0.35 ? 1 : 0);
  for (let n = 0; n < num; n++) {
    const { x, y } = pickEmptyRegion();
    for (let i = 0; i < nc.agentsPerNucleus; i++) {
      // Steal a random existing agent and relocate it — total count stays constant
      const ag = agents[Math.floor(Math.random() * agents.length)];
      const th = Math.random() * Math.PI * 2;
      const r  = Math.random() * nc.radius;
      ag.x = ((x + Math.cos(th) * r) % W + W) % W;
      ag.y = ((y + Math.sin(th) * r) % H + H) % H;
      ag.a = th;  // point outward from nucleus centre
    }
  }
}

// ── Simulation step ───────────────────────────────────────────────────────────

function sample(x, y) {
  // Torus-wrapped nearest-cell trail lookup
  const ix = ((x | 0) % W + W) % W;
  const iy = ((y | 0) % H + H) % H;
  return trail[iy * W + ix];
}

function step() {
  const { sa, ra, sd, step: spd, decay, spread, deposit, burst } = cfg;
  const wander = (burstActive && burst) ? burst.wander : cfg.wander;

  // Phase 1: sense → steer → move → deposit
  for (const ag of agents) {
    let mx, my;

    if (wander > 0 && Math.random() < wander) {
      // Wander: ignore all trail sensing, pick a completely fresh heading.
      // This continuously seeds new paths in unexplored directions and
      // prevents the simulation from locking into a static equilibrium.
      ag.a = Math.random() * Math.PI * 2;
      mx = Math.cos(ag.a);  my = Math.sin(ag.a);
    } else {
      const cos_a = Math.cos(ag.a), sin_a = Math.sin(ag.a);

      const fwd   = sample(ag.x + cos_a               * sd,  ag.y + sin_a               * sd);
      const left  = sample(ag.x + Math.cos(ag.a - sa) * sd,  ag.y + Math.sin(ag.a - sa) * sd);
      const right = sample(ag.x + Math.cos(ag.a + sa) * sd,  ag.y + Math.sin(ag.a + sa) * sd);

      mx = cos_a; my = sin_a;   // default: straight
      if (fwd >= left && fwd >= right) {
        // Strongest signal is ahead — continue forward
      } else if (left > right) {
        ag.a -= ra;  mx = Math.cos(ag.a);  my = Math.sin(ag.a);
      } else if (right > left) {
        ag.a += ra;  mx = Math.cos(ag.a);  my = Math.sin(ag.a);
      } else {
        ag.a += (Math.random() < 0.5 ? 1 : -1) * ra;
        mx = Math.cos(ag.a);  my = Math.sin(ag.a);
      }
    }

    ag.x = ((ag.x + mx * spd) % W + W) % W;
    ag.y = ((ag.y + my * spd) % H + H) % H;

    const ci = (ag.y | 0) * W + (ag.x | 0);
    trail[ci] = Math.min(1, trail[ci] + deposit);
  }

  // Phase 2: diffuse + decay (3×3 equal-weight box blur blended with original)
  for (let cy = 0; cy < H; cy++) {
    const yn = ((cy - 1 + H) % H) * W;
    const yc = cy * W;
    const ys = ((cy + 1)     % H) * W;
    for (let cx = 0; cx < W; cx++) {
      const xw = (cx - 1 + W) % W, xe = (cx + 1) % W;
      const avg = (
        trail[yc + cx] + trail[yn + cx] + trail[ys + cx] +
        trail[yc + xw] + trail[yc + xe] +
        trail[yn + xw] + trail[yn + xe] +
        trail[ys + xw] + trail[ys + xe]
      ) * (1 / 9);
      trailB[yc + cx] = ((1 - spread) * trail[yc + cx] + spread * avg) * decay;
    }
  }

  // Stagnation detection — only for presets with a burst config (blobs)
  if (burst) {
    let trailSum = 0;
    for (let i = 0; i < W * H; i++) trailSum += trailB[i];
    const delta = Math.abs(trailSum - prevTrailSum);
    prevTrailSum = trailSum;
    trailDeltaEMA = (1 - burst.emaAlpha) * trailDeltaEMA + burst.emaAlpha * delta;

    if (burstActive) {
      if (--burstRemaining <= 0) { burstActive = false; burstCooldown = burst.cooldown; }
    } else if (burstCooldown > 0) {
      burstCooldown--;
    } else if (trailDeltaEMA < burst.threshold) {
      burstActive = true; burstRemaining = burst.duration;
    }
  }

  // Nucleus injection — all presets, when the toggle is on
  if (nucleusEnabled && cfg.nucleus && --nucleusTick <= 0) {
    injectNucleus();
    const nc = cfg.nucleus;
    nucleusTick = nc.minInterval + Math.floor(Math.random() * (nc.maxInterval - nc.minInterval));
  }

  // Swap buffers
  let tmp = trail;  trail = trailB;  trailB = tmp;
}

// ── Rendering ─────────────────────────────────────────────────────────────────

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = PW;
canvas.height = PH;

// Soft circular LED dot kernel
const kern = new Float32Array(CELL * CELL);
{
  const h = CELL * 0.5;
  for (let py = 0; py < CELL; py++)
    for (let px = 0; px < CELL; px++) {
      const dx = px - h + 0.5, dy = py - h + 0.5;
      const d  = Math.sqrt(dx*dx + dy*dy) / (h * 0.88);
      kern[py * CELL + px] = Math.max(0, 1 - d * d);
    }
}

const imgData  = ctx.createImageData(PW, PH);
const buf      = imgData.data;
const rowBytes = PW * 4;

function render() {
  const [pr, pg, pb] = curColor;

  for (let cy = 0; cy < H; cy++) {
    for (let cx = 0; cx < W; cx++) {
      const t  = trail[cy * W + cx];

      // Each channel develops at a different rate: blue first, then green, then red.
      // This creates a cool-to-warm hue shift as trail intensity rises, then
      // bleaches to white at high intensity — similar to a heat-map LUT.
      const rr = Math.pow(t, 0.52);
      const rg = Math.pow(t, 0.44);
      const rb = Math.pow(t, 0.37);
      const wh = Math.pow(t, 1.8);    // whitening onset — more paths appear "hot"
      const cr = Math.min(255, pr * rr + 255 * wh) | 0;
      const cg = Math.min(255, pg * rg + 255 * wh) | 0;
      const cb = Math.min(255, pb * rb + 255 * wh) | 0;

      const ox = cx * CELL, oy = cy * CELL;
      for (let py = 0; py < CELL; py++) {
        const row = (oy + py) * rowBytes + ox * 4;
        for (let px = 0; px < CELL; px++) {
          const k  = kern[py * CELL + px];
          const pi = row + px * 4;
          buf[pi  ] = (cr * k)               | 0;
          buf[pi+1] = (cg * k)               | 0;
          buf[pi+2] = (cb * k + (1 - k) * 5) | 0;  // ambient blue bleed
          buf[pi+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Loop ──────────────────────────────────────────────────────────────────────

let raf       = null;
let speedMult = 0.1;
let stepAccum = 0.0;

function loop() {
  // Accumulate fractional steps so speeds below 1× still work smoothly
  stepAccum += cfg.spf * speedMult;
  const steps = Math.floor(stepAccum);
  stepAccum  -= steps;
  for (let i = 0; i < steps; i++) step();
  render();
  raf = requestAnimationFrame(loop);
}

function restart(key, seed) {
  if (raf) cancelAnimationFrame(raf);
  stepAccum = 0;
  init(key, seed);
  loop();
}

// ── Controls ──────────────────────────────────────────────────────────────────

let activeSeed = 42;

document.getElementById('preset').addEventListener('change', e => {
  restart(e.target.value, activeSeed);
});

const speedEl      = document.getElementById('speed');
const speedLabelEl = document.getElementById('speedLabel');
speedEl.addEventListener('input', () => {
  speedMult = +speedEl.value / 500;
  speedLabelEl.textContent = speedEl.value + '%';
});

document.getElementById('btn').addEventListener('click', () => {
  activeSeed = Math.floor(Math.random() * 99999);
  restart(document.getElementById('preset').value, activeSeed);
});

const nucleiBtn = document.getElementById('nucleiBtn');
nucleiBtn.addEventListener('click', () => {
  nucleusEnabled = !nucleusEnabled;
  nucleiBtn.classList.toggle('active', nucleusEnabled);
});

restart('network', activeSeed);
</script>
</body>
</html>
